<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="TorqueWrench is a DIY car maintenance app. Log your work, keep a service history for each vehicle, and see what’s due by date or mileage.">
  <meta name="theme-color" content="#F1F7F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#143338" media="(prefers-color-scheme: dark)">
  <title>TorqueWrench — DIY car maintenance</title>
  <link rel="canonical" href="https://twdiy.app/">
  <link rel="icon" href="assets/torquewrench-icon-32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <picture>
        <source srcset="assets/torquewrench-logo-dark.svg" media="(prefers-color-scheme: dark)">
        <img class="wordmark" src="assets/torquewrench-logo-light.svg" alt="TorqueWrench" width="317" height="66">
      </picture>
    </header>

    <main class="hero">
      <div class="intro">
        <h1><span>DIY car</span> maintenance</h1>
        <p>Log the work you do on each vehicle and see what’s due next by date or mileage.</p>
        <div class="actions">
          <a class="button" href="https://web.twdiy.app/">Open web app</a>
          <a class="text-link" href="https://github.com/twdiy-app">View on GitHub</a>
        </div>
      </div>

      <div class="hero-art" aria-hidden="true">
        <img src="assets/torquewrench-symbol-dark.svg" alt="" width="70" height="70">
      </div>
    </main>

    <footer class="site-footer">
      <span>Contact</span>
      <a href="mailto:support@twdiy.app">support@twdiy.app</a>
    </footer>
  </div>
</body>
</html>
